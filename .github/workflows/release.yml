name: release

# A version tag builds the RPMs and the DEBs, for x86_64/amd64 and aarch64/arm64, signs them, publishes them
# into the rpm/ and deb/ trees of the FreeMixer Pages repository and attaches the RPMs to the GitHub release.
# Anything else, a manual run from a branch or the dry run of ci.yml, builds and assembles unsigned trees and
# publishes nothing. Everything is in FreeMixer/.github; the secrets are the organisation's.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Sign and publish; only a run on a tag publishes'
        type: boolean
        default: false
      arm:
        description: 'Build the aarch64/arm64 packages too; a pull request dry run passes false'
        type: boolean
        default: true
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      arm:
        type: boolean
        default: true
        description: 'Build the aarch64/arm64 packages too; the pull-request dry run passes false (arm builds run at release only)'

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  rpm:
    uses: FreeMixer/.github/.github/workflows/build-rpm.yml@v1
    with:
      package-name: plugin-hostd
      publish: ${{ github.event_name == 'push' || inputs.publish == true }}
      arch-matrix: ${{ (github.event_name != 'push' && inputs.arm == false) && '["x86_64"]' || '["x86_64", "aarch64"]' }}
    secrets: inherit

  # after the RPMs: both publish into one tree, and a push that loses a race is refused. A release is one wave: a red
  # or skipped RPM job skips this one, so no DEB is published after a failed RPM.
  deb:
    needs: rpm
    uses: FreeMixer/.github/.github/workflows/build-deb.yml@v1
    with:
      package-name: plugin-hostd
      publish: ${{ github.event_name == 'push' || inputs.publish == true }}
      arch-matrix: ${{ (github.event_name != 'push' && inputs.arm == false) && '["amd64"]' || '["amd64", "arm64"]' }}
    secrets: inherit

  # plugin-hostd-full from the channel, the way the install pages say, in a clean container of every Debian release and
  # Fedora the stack ships for, on both architectures: the default install pulls every package of the stack, omx-panel
  # with it, and the records of the machine's class; the headless one (--no-install-recommends,
  # install_weak_deps=False) leaves out omx-panel and every X server, Xlib, Wayland and GTK package
  # (tools/full-install-check.sh, which also names the only packages allowed to pull libxcb and nodejs). After the
  # publish of a tag only: the channel is where it installs from.
  full-deb:
    name: plugin-hostd-full (${{ matrix.suite }}, ${{ matrix.arch }}, ${{ matrix.mode }})
    needs: deb
    if: ${{ !cancelled() && needs.deb.result == 'success' && github.ref_type == 'tag' }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: debian:${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie]
        arch: [amd64, arm64]
        mode: [default, headless]
    steps:
      - uses: actions/checkout@v4
      - uses: FreeMixer/.github/.github/actions/add-openmixer@v1
      - run: bash tools/full-install-check.sh deb "$GITHUB_REF_NAME" ${{ matrix.mode }}

  full-rpm:
    name: plugin-hostd-full (Fedora 44, ${{ matrix.arch }}, ${{ matrix.mode }})
    needs: rpm
    if: ${{ !cancelled() && needs.rpm.result == 'success' && github.ref_type == 'tag' }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: fedora:44
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        mode: [default, headless]
    steps:
      - uses: actions/checkout@v4
      - uses: FreeMixer/.github/.github/actions/add-openmixer@v1
      - run: bash tools/full-install-check.sh rpm "$GITHUB_REF_NAME" ${{ matrix.mode }}
