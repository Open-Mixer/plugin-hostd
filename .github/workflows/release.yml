name: release

# A version tag builds the RPMs and the DEBs, for x86_64/amd64 and aarch64/arm64, signs them, publishes them
# into the rpm/ and deb/ trees of the FreeMixer Pages repository and attaches the RPMs to the GitHub release.
# Anything else, a manual run from a branch or the dry run of ci.yml, builds and assembles unsigned trees and
# publishes nothing. Everything is in Open-Mixer/.github; the secrets are the organisation's.

# A manual run with staged on (never a tag) builds fc44 x86_64 and trixie amd64 only, against the staging channel, and
# publishes them, signed, to the staging channel (staging/rpm and staging/deb of the channel repository), where the
# next layer of the release chain finds them by adding the staging channel beside the real one. Nothing reaches the
# real channel, and the real release still publishes once from the v<version> tag (Open-Mixer/.github build-rpm.yml
# and build-deb.yml).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Sign and publish; only a run on a tag, or one naming a tag in source-ref, publishes'
        type: boolean
        default: false
      source-ref:
        description: 'Tag v<version> to release with this workflow (a tag whose own release workflow can no longer run); empty builds the branch'
        type: string
        default: ''
      republish:
        description: 'Let the release go out over a version the channel already serves (finish a partial publish)'
        type: boolean
        default: false
      arm:
        description: 'Build the aarch64/arm64 packages too; a pull request dry run passes false'
        type: boolean
        default: true
      staged:
        description: 'Build fc44 x86_64 and trixie amd64 only and publish them to the staging channel for the next layer; publishes nothing to the real channel'
        type: boolean
        default: false
      staged-deps:
        description: 'Ignored by the shared workflows, kept for this wave only'
        type: string
        default: ''
      catch-up:
        description: 'With source-ref: build and publish only the cells of the set the served version lacks; never rewrites a file the channel serves'
        type: boolean
        default: false
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      arm:
        type: boolean
        default: true
        description: 'Build the aarch64/arm64 packages too; the pull-request dry run passes false (arm builds run at release only)'
      staged:
        type: boolean
        default: false
      staged-deps:
        type: string
        default: ''

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  rpm:
    uses: Open-Mixer/.github/.github/workflows/build-rpm.yml@openmixer-v1
    with:
      staged: ${{ inputs.staged == true }}
      staged-deps: ${{ inputs.staged-deps || '' }}
      package-name: plugin-hostd
      publish: ${{ github.event_name == 'push' || inputs.publish == true }}
      source-ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source-ref || '' }}
      republish: ${{ github.event_name == 'workflow_dispatch' && inputs.republish == true }}
      catch-up: ${{ github.event_name == 'workflow_dispatch' && inputs.catch-up == true }}
      arch-matrix: ${{ (github.event_name != 'push' && inputs.arm == false && !inputs.source-ref) && '["x86_64"]' || '["x86_64", "aarch64"]' }}
    secrets: inherit

  # or skipped RPM job skips this one, so no DEB is published after a failed RPM.
  # beside the RPMs: the two publish jobs share one concurrency group, so their pushes never race
  deb:
    uses: Open-Mixer/.github/.github/workflows/build-deb.yml@openmixer-v1
    with:
      staged: ${{ inputs.staged == true }}
      staged-deps: ${{ inputs.staged-deps || '' }}
      package-name: plugin-hostd
      publish: ${{ github.event_name == 'push' || inputs.publish == true }}
      source-ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source-ref || '' }}
      republish: ${{ github.event_name == 'workflow_dispatch' && inputs.republish == true }}
      catch-up: ${{ github.event_name == 'workflow_dispatch' && inputs.catch-up == true }}
      arch-matrix: ${{ (github.event_name != 'push' && inputs.arm == false && !inputs.source-ref) && '["amd64"]' || '["amd64", "arm64"]' }}
    secrets: inherit

  # plugin-hostd-full from the channel, the way the install pages say, in a clean container of every Debian release and
  # Fedora the stack ships for, on both architectures: the default install pulls every package of the stack, omx-panel
  # with it, and the records of the machine's class; the headless one (--no-install-recommends,
  # install_weak_deps=False) leaves out omx-panel and every X server, Xlib, Wayland and GTK package
  # (tools/full-install-check.sh, which also names the only packages allowed to pull libxcb and nodejs). After the
  # publish of a tag only: the channel is where it installs from. Not on a catch-up, whose cells are not these.
  # The cells follow the release set (ruling D25, Open-Mixer/.github#59): while the organisation variable
  # OMX_RELEASE_MATRIX is quick, only the quick cells the release built (check-matrix reads the shared quick set);
  # full, or unset, every cell below. A cell outside the set is skipped by the variable, never deleted here.
  checks:
    name: plugin-hostd-full cells
    if: ${{ github.ref_type == 'tag' && inputs.catch-up != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      rpm: ${{ steps.m.outputs.rpm }}
      rpm-count: ${{ steps.m.outputs.rpm-count }}
      deb: ${{ steps.m.outputs.deb }}
      deb-count: ${{ steps.m.outputs.deb-count }}
    steps:
      - id: m
        uses: Open-Mixer/.github/.github/actions/check-matrix@openmixer-v1
        with:
          wave: ${{ vars.OMX_RELEASE_MATRIX }}
          rpm-releases: '["44"]'
          rpm-arches: '["x86_64", "aarch64"]'
          deb-releases: '["bookworm", "trixie"]'
          deb-arches: '["amd64", "arm64"]'

  full-deb:
    name: plugin-hostd-full (${{ matrix.cell.suite }}, ${{ matrix.cell.arch }}, ${{ matrix.mode }})
    needs: [deb, checks]
    if: ${{ !cancelled() && needs.deb.result == 'success' && needs.checks.result == 'success' && needs.checks.outputs.deb-count != '0' && github.ref_type == 'tag' && inputs.catch-up != true }}
    runs-on: ${{ matrix.cell.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: ${{ matrix.cell.image }}
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.checks.outputs.deb) }}
        mode: [default, headless]
    steps:
      - uses: actions/checkout@v4
      - uses: Open-Mixer/.github/.github/actions/add-openmixer@main
      - run: bash tools/full-install-check.sh deb "$GITHUB_REF_NAME" ${{ matrix.mode }}

  full-rpm:
    name: plugin-hostd-full (Fedora ${{ matrix.cell.fedora }}, ${{ matrix.cell.arch }}, ${{ matrix.mode }})
    needs: [rpm, checks]
    if: ${{ !cancelled() && needs.rpm.result == 'success' && needs.checks.result == 'success' && needs.checks.outputs.rpm-count != '0' && github.ref_type == 'tag' && inputs.catch-up != true }}
    runs-on: ${{ matrix.cell.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: ${{ matrix.cell.image }}
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.checks.outputs.rpm) }}
        mode: [default, headless]
    steps:
      - uses: actions/checkout@v4
      - uses: Open-Mixer/.github/.github/actions/add-openmixer@main
      - run: bash tools/full-install-check.sh rpm "$GITHUB_REF_NAME" ${{ matrix.mode }}
