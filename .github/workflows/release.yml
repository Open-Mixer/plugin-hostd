name: release

# A version tag builds the RPMs (x86_64) and the DEBs (amd64 and arm64), signs them, publishes them
# into the rpm/ and deb/ trees of the OpenMixer Pages repository and attaches the RPMs to the GitHub release.
# Anything else, a manual run from a branch or the dry run of ci.yml, builds and assembles unsigned trees and
# publishes nothing. Everything is in Open-Mixer/.github; the secrets are the organisation's.

# A manual run with staged on (never a tag) builds fc45 x86_64 and trixie amd64 only, against the staging channel, and
# publishes them, signed, to the staging channel (staging/rpm and staging/deb of the channel repository), where the
# next layer of the release chain finds them by adding the staging channel beside the real one. Nothing reaches the
# real channel, and the real release still publishes once from the v<version> tag (Open-Mixer/.github build-rpm.yml
# and build-deb.yml).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Sign and publish; only a run on a tag, or one naming a tag in source-ref, publishes'
        type: boolean
        default: false
      source-ref:
        description: 'Tag v<version> to release with this workflow (a tag whose own release workflow can no longer run); empty builds the branch'
        type: string
        default: ''
      republish:
        description: 'Let the release go out over a version the channel already serves (finish a partial publish)'
        type: boolean
        default: false
      arm:
        description: 'Build the aarch64/arm64 packages too; a pull request dry run passes false'
        type: boolean
        default: true
      staged:
        description: 'Build fc45 x86_64 and trixie amd64 only and publish them to the staging channel for the next layer; publishes nothing to the real channel'
        type: boolean
        default: false
      staged-deps:
        description: 'Ignored by the shared workflows, kept for this wave only'
        type: string
        default: ''
      catch-up:
        description: 'With source-ref: build and publish only the cells of the set the served version lacks; never rewrites a file the channel serves'
        type: boolean
        default: false
      same_pass:
        description: 'Packages other repositories release later in the same pass, space separated; empty reads .github/release-same-pass at the commit built'
        type: string
        default: ''
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      arm:
        type: boolean
        default: true
        description: 'Build the aarch64/arm64 packages too; the pull-request dry run passes false (arm builds run at release only)'
      staged:
        type: boolean
        default: false
      staged-deps:
        type: string
        default: ''
      same_pass:
        type: string
        default: ''

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  # The packages other repositories release LATER in this same pass, for the channel-installability gate's same-pass
  # (a breakage they cause or suffer is reported, not red): a dispatch's same_pass input, else the tracked
  # .github/release-same-pass at the very commit this run builds (the tag on a push, source-ref when one is named), one
  # package per line, # comments allowed. The file is reviewed like code, lives on its release branch and goes with it;
  # never a repository variable, which is mutable, unversioned and can outlive its pass to excuse a later break.
  samepass:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-same-pass
          sparse-checkout-cone-mode: false
      - id: read
        env:
          NAMED_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.source-ref || '' }}
        run: |
          f=.github/release-same-pass
          # a named source-ref is fetched and its file read from FETCH_HEAD: no checkout is pinned to a ref (make check-no-pins)
          if [ -n "$NAMED_SOURCE" ]; then
            git fetch --quiet --depth=1 origin "$NAMED_SOURCE" || { echo "::error::cannot fetch source-ref $NAMED_SOURCE"; exit 1; }
            rm -f "$f"
            git show "FETCH_HEAD:$f" >"$f" 2>/dev/null || rm -f "$f"
          fi
          [ -f "$f" ] || { echo "list=" >>"$GITHUB_OUTPUT"; echo "no $f at this commit: nothing released in the same pass"; exit 0; }
          names=$(sed -e 's/#.*//' "$f" | tr -s ' \t\r\n' '\n' | sed '/^$/d')
          for n in $names; do
            [[ "$n" =~ ^[a-z0-9][a-z0-9.+-]*$ ]] || { echo "::error::$f: '$n' is not a package name"; exit 1; }
          done
          list=$(echo $names)
          echo "list=$list" >>"$GITHUB_OUTPUT"
          echo "same pass from $f: ${list:-none}"

  rpm:
    needs: samepass
    uses: Open-Mixer/.github/.github/workflows/build-rpm.yml@openmixer-v1
    with:
      same-pass: ${{ inputs.same_pass || needs.samepass.outputs.list }}
      staged: ${{ inputs.staged == true }}
      staged-deps: ${{ inputs.staged-deps || '' }}
      package-name: plugin-hostd
      publish: ${{ github.event_name == 'push' || inputs.publish == true }}
      source-ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source-ref || '' }}
      republish: ${{ github.event_name == 'workflow_dispatch' && inputs.republish == true }}
      catch-up: ${{ github.event_name == 'workflow_dispatch' && inputs.catch-up == true }}
      arch-matrix: '["x86_64"]'
    secrets: inherit

  # or skipped RPM job skips this one, so no DEB is published after a failed RPM.
  # beside the RPMs: the two publish jobs share one concurrency group, so their pushes never race
  deb:
    needs: samepass
    uses: Open-Mixer/.github/.github/workflows/build-deb.yml@openmixer-v1
    with:
      same-pass: ${{ inputs.same_pass || needs.samepass.outputs.list }}
      staged: ${{ inputs.staged == true }}
      staged-deps: ${{ inputs.staged-deps || '' }}
      package-name: plugin-hostd
      publish: ${{ github.event_name == 'push' || inputs.publish == true }}
      source-ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source-ref || '' }}
      republish: ${{ github.event_name == 'workflow_dispatch' && inputs.republish == true }}
      catch-up: ${{ github.event_name == 'workflow_dispatch' && inputs.catch-up == true }}
      arch-matrix: ${{ (github.event_name != 'push' && inputs.arm == false && !inputs.source-ref) && '["amd64"]' || '["amd64", "arm64"]' }}
    secrets: inherit
