name: bench

# The benchmark harness, cheaply: the shipped example satisfies its schema, the scripts pass shellcheck, every guard of
# the harness goes red when broken, and one small scenario runs under each host the container has, on JACK's dummy
# driver at 48 kHz. It checks that a valid document comes out, not the numbers.

on:
  pull_request:
    paths: ['bench/**', 'tools/zynthian/matrix.py', 'tools/zynthian/matrix/**', 'tools/zynthian/test_matrix.py', '.github/workflows/bench.yml']
  push:
    branches: [main]
    paths: ['bench/**', 'tools/zynthian/matrix.py', 'tools/zynthian/matrix/**', 'tools/zynthian/test_matrix.py', '.github/workflows/bench.yml']

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels the run it supersedes. Every other run (main, a tag) has a group of its own
  # and is never cancelled; the run id keeps two pushes to main from replacing each other while one is queued.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # the daemon the smoke run drives is this run's: built here, as ci.yml's deb job builds it, and installed from these
  # files. The channel serves the rest; by name it serves plugin-hostd only for a version it has published on that cell
  debs:
    name: plugin-hostd's DEBs (trixie, amd64) for the smoke run
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.OMX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    container:
      image: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      # every package manager call below runs bounded (tools/bounded-install.sh): a hung mirror is a fast red
      # naming it, never a hang to timeout-minutes. The wrapper is fetched first and copied onto PATH, since
      # the job's own checkout cleans every file it does not track.
      - uses: actions/checkout@v4
        with:
          path: .ci-tools
          sparse-checkout: tools/bounded-install.sh
          sparse-checkout-cone-mode: false
      - name: The bounded package manager wrapper
        run: install -m 0755 .ci-tools/tools/bounded-install.sh /usr/local/bin/bounded-install && rm -rf .ci-tools
      - name: Install the build tools
        run: |
          bounded-install apt-get update -qq
          bounded-install apt-get install -y --no-install-recommends ca-certificates curl git dpkg-dev debhelper build-essential lintian python3

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # the OpenMixer channel: where the Build-Depends Debian does not carry come from
      - name: Add the OpenMixer channel
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1

      - uses: Open-Mixer/.github/.github/actions/wave-deps@openmixer-v1

      - uses: Open-Mixer/.github/.github/actions/deb-deps@openmixer-v1
        with:
          names: clap-headers

      - uses: Open-Mixer/.github/.github/actions/build-deb@openmixer-v1

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-hostd-bench-debs
          path: debs/*.deb
          if-no-files-found: error
          retention-days: 1

  bench:
    name: harness check and smoke run
    needs: debs
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.OMX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    container:
      image: debian:trixie
      # jackd's first segment (/dev/shm/jack-0-0) is about 103 MB: with Docker's 64 MB default its metadata DB cannot
      # open and the private servers of the xrun probe and the smoke run never start (#81's box proof)
      options: --shm-size=256m
    defaults:
      run:
        shell: bash
    steps:
      # every package manager call below runs bounded (tools/bounded-install.sh): a hung mirror is a fast red
      # naming it, never a hang to timeout-minutes. The wrapper is fetched first and copied onto PATH, since
      # the job's own checkout cleans every file it does not track.
      - uses: actions/checkout@v4
        with:
          path: .ci-tools
          sparse-checkout: tools/bounded-install.sh
          sparse-checkout-cone-mode: false
      - name: The bounded package manager wrapper
        run: install -m 0755 .ci-tools/tools/bounded-install.sh /usr/local/bin/bounded-install && rm -rf .ci-tools
      - uses: actions/download-artifact@v4
        with:
          name: plugin-hostd-bench-debs
          path: debs

      - name: Install this run's plugin-hostd, and the other hosts, JACK and the plugins from the OpenMixer channel
        run: |
          set -euo pipefail
          bounded-install apt-get update -qq
          bounded-install apt-get install -y --no-install-recommends ca-certificates curl
          curl -fsSLO https://www.openmixer.org/deb/openmixer-release.deb
          bounded-install apt-get install -y ./openmixer-release.deb
          bounded-install apt-get update -qq
          DEBIAN_FRONTEND=noninteractive bounded-install apt-get install -y --no-install-recommends python3 python3-jsonschema \
            shellcheck procps netcat-openbsd pkgconf libplugin-hostd-protocol-dev omx-clap-host omx-plugins-clap omx-plugins-lv2 \
            jackd2 jack-example-tools jalv calf-plugins ./debs/plugin-hostd_*.deb ./debs/plugin-hostd-contract_*.deb

      - uses: actions/checkout@v4

      - name: The shipped example satisfies the schema, read by the harness and by python3-jsonschema
        run: |
          set -euo pipefail
          bench/validate.sh bench/examples/*.json
          for f in bench/examples/*.json; do
            python3 -c 'import json, sys, jsonschema; jsonschema.validate(json.load(open(sys.argv[1])), json.load(open(sys.argv[2])))' \
              "$f" bench/schema/omx-bench.v1.schema.json
          done

      - name: shellcheck
        run: shellcheck bench/run.sh bench/validate.sh bench/table.sh bench/matrix.sh bench/gate.sh bench/lib/send.sh bench/tests/sabotage.sh

      - name: Unit tests of the harness
        run: python3 -I bench/tests/test_bench.py

      - name: Unit tests of the matrix report
        run: python3 -I bench/tests/test_matrix.py

      - name: The xrun probe against a JACK server that dies or stops answering
        run: python3 -I bench/tests/test_probe_jack.py

      - name: Unit tests of the Zynthian benchmark matrix
        run: python3 -I tools/zynthian/test_matrix.py

      - name: Unit tests of the report writer
        run: python3 -I -m unittest discover -v -s bench/report

      - name: Every guard of the harness goes red when broken
        run: bench/tests/sabotage.sh --teardown

      - name: One small scenario under each host, and a valid document out
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p "$XDG_RUNTIME_DIR"
          bench/run.sh --class ci --out smoke --rates 48000 --frames 256 --window 2 --repeats 1 --scenarios lv2-1 --keep-governor
          bench/validate.sh smoke/*.json
          python3 - smoke/*.json <<'EOF'
          import json, shutil, sys
          rows = json.load(open(sys.argv[1]))["scenarios"]
          for host, prog in (("H1", "omx-clap-host"), ("H2", "plugin-hostd"), ("H3", "mod-host"), ("H4", "jalv")):
              row = [r for r in rows if r["host"] == host][0]
              print(host, prog, row["status"], row["note"])
              if shutil.which(prog) and row["status"] == "unsupported":
                  sys.exit("%s is installed and its row says unsupported" % prog)
          EOF
